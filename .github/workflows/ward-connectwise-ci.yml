name: WARD ConnectWise Incident Defense

on:
  push:
    branches:
      - main
      - ward-connectwise-2026-incident-defense
    paths:
      - 'integrations/ward-connectwise/**'
      - '.github/workflows/ward-connectwise-ci.yml'
  pull_request:
    paths:
      - 'integrations/ward-connectwise/**'
      - '.github/workflows/ward-connectwise-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    name: Offline detector tests and release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit and synthetic incident tests
        working-directory: integrations/ward-connectwise
        shell: bash
        run: |
          set -euo pipefail
          bash verify.sh
      - name: Validate deployment source and stage package
        shell: bash
        run: |
          set -euo pipefail
          root=integrations/ward-connectwise
          test -s "$root/ward_detector.py"
          test -s "$root/scripts/Collect-WardEvidence.ps1"
          test -s "$root/scripts/Disable-WardConnectWise.ps1"
          test -s "$root/sentinel/ward_connectwise_signins.kql"
          test -s "$root/sentinel/ward_connectwise_directory_changes.kql"
          test -s "$root/README.md"
          mkdir -p dist/ward-connectwise
          cp "$root/README.md" "$root/ward_detector.py" "$root/verify.sh" dist/ward-connectwise/
          cp -R "$root/scripts" "$root/sentinel" "$root/tests" "$root/fixtures" dist/ward-connectwise/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('dist/ward-connectwise')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          manifest = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          (root / 'SHA256SUMS.json').write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          print(f'Packaged {len(files)} source files with SHA256 hashes.')
          PY
      - name: Publish verified deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ward-connectwise-incident-defense
          path: dist/ward-connectwise/
          if-no-files-found: error
          retention-days: 30
