[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fads-guardian"
version = "0.1.0"
description = "Fail-closed guardian and capability broker for sandboxed agents"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
fads = "fads.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
